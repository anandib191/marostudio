    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
      :root {
        --accent: #6366f1; /* Indigo 500 */
        --bg: #050505;
        --surface: #121212;
      }
      body {
        background-color: var(--bg);
        font-family: 'Plus Jakarta Sans', sans-serif;
        color: #f8fafc;
        overflow-x: hidden;
        letter-spacing: -0.01em;
      }
      .font-serif-display {
        font-family: 'Playfair Display', serif;
      }
      
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #262626; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #404040; }

      /* Minimalist Loading Polish */
      .loading-container {
        border: 1px solid rgba(99, 102, 241, 0.4);
        box-shadow: 0 0 30px rgba(99, 102, 241, 0.15);
        animation: pulse-glow 3s ease-in-out infinite;
      }

      @keyframes pulse-glow {
        0%, 100% { opacity: 0.8; box-shadow: 0 0 20px rgba(99, 102, 241, 0.1); }
        50% { opacity: 1; box-shadow: 0 0 40px rgba(99, 102, 241, 0.3); }
      }

      @keyframes shimmer {
        100% { transform: translateX(100%); }
      }
      .shimmer-container::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.03) 50%, transparent 100%);
        transform: translateX(-100%);
        animation: shimmer 2.5s infinite;
      }

      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up {
        animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.95) translateY(-10px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }

      .btn-glow {
        position: relative;
        overflow: hidden;
      }
      .btn-glow::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(99, 102, 241, 0.2) 0%, transparent 70%);
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .btn-glow:hover::after {
        opacity: 1;
      }

      /* Perspective for Cards */
      .perspective-container {
        perspective: 2000px;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
    </style>
